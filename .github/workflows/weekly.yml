name: weekly-news
on:
  schedule:
    - cron: "*/5 * * * *"  
      timezone: "Europe/London"
  workflow_dispatch:   
  
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger information
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Time: $(date)"
      - uses: actions/checkout@f93ca50bde35f63a65c67fc94cc8821ead20e631
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with: { python-version: "3.13" }
      - run: python scripts/build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SECOND_PASS: "0"
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "weekly update" || exit 0
          git push

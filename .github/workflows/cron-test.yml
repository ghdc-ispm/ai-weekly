name: Cron Trigger Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "CRON TRIGGER WORKED!"
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"

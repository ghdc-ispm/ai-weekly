<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>AI Weekly</title>
<style>
body{font-family:system-ui;margin:1rem;background:#f4f4f5}
#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.c{background:#fff;border-radius:12px;padding:14px}
h2{font-size:1rem;margin:0 0 8px}
li{margin:6px 0}small{color:#666}
</style>
<h1>AI Weekly</h1><div id="g"></div>
<script>
fetch("data.json").then(r=>r.json()).then(d=>{
  const g=document.getElementById("g");
  for(const [cat,list] of Object.entries(d)){
    const c=document.createElement("div");c.className="c";
    const h=document.createElement("h2");h.textContent=cat;c.append(h);
    const ul=document.createElement("ul");
    for(const i of list){
      const li=document.createElement("li"),a=document.createElement("a");
      a.textContent=i.title;
      if(/^https:\/\//.test(i.link)){a.href=i.link;a.rel="noopener noreferrer";}
      li.append(a);
      if(i.source){const s=document.createElement("small");s.textContent=" · "+i.source;li.append(s);}
      ul.append(li);
    }
    c.append(ul);g.append(c);
  }
});
</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'">
<title>AI Weekly</title>
<style>
@font-face{font-family:"Noto Serif";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/noto-serif-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/montserrat-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Sans";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/noto-sans-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--serif:"Noto Serif",-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Oxygen-Sans","Ubuntu","Cantarell","Helvetica Neue",sans-serif;--head:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Oxygen-Sans","Ubuntu","Cantarell","Helvetica Neue",sans-serif;--sans:"Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Oxygen-Sans","Ubuntu","Cantarell","Helvetica Neue",sans-serif;--bg:#ffffff;--card:#f9f9f9;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2d9;--ch:400px;--lh:250px;--py:18px;--px:20px}
@media(prefers-color-scheme:dark){:root{--bg:#ffffff;--card:#1c1c1e;--ink:#ececec;--muted:#9a9a9a;--line:#2c2c2e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 48px}
header{text-align:center;padding:44px 0 24px;border-bottom:3px double var(--line);margin-bottom:28px}
header h1{font:700 clamp(2.2rem,8vw,3.6rem)/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--muted)}
#date{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.hero{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:0;padding:28px;margin-bottom:20px}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero h2{font:700 clamp(1.2rem,3.5vw,1.7rem)/1.25 var(--sans);margin:8px 0}
.src{color:var(--muted);font-size:.8rem}

/* fixed grid: 3 columns x 2 rows of fixed slots, then "Other" full width */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.card{display:flex;flex-direction:column;height:var(--ch);overflow:hidden;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:0;padding:var(--py) var(--px);font-family:var(--serif)}
.card.open{height:auto}
.card h3{flex:none;font-family:var(--head);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 10px}
.card ol{flex:1;min-height:0;overflow:hidden;margin:0;padding:0;list-style:none;counter-reset:n}
.card.open ol{flex:none;overflow:visible}
.card li{counter-increment:n;padding:10px 0 10px 28px;position:relative;border-top:1px solid var(--line)}
.card li:first-child{border-top:0}
.card li::before{content:counter(n);position:absolute;left:0;top:10px;font:700 1rem var(--serif);color:var(--muted)}
.card li a{font-weight:600;line-height:1.35}
.card li .src{display:block;margin-top:2px}
.card li.hid{display:none}
.card.open li.hid{display:block}
.card li.empty{counter-increment:none;padding-left:0;color:var(--muted);font-style:italic}
.card li.empty::before{content:none}
.card li.more{counter-increment:none;padding-left:0}
.card li.more::before{content:none}
.card li.more button{background:none;border:0;padding:4px 0;font:inherit;font-size:.85rem;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.other{height:var(--lh);margin-top:16px}
.other ol{display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px;align-content:start}
.other li,.other li:first-child{border-top:0;border-bottom:1px solid var(--line)}
.other li.more{grid-column:1/-1;border-bottom:0}
.past{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px}
.past a{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-size:.8rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:36px}

@media(max-width:899px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .other ol{grid-template-columns:repeat(2,1fr)}
}
/* phone: single column, natural height, nothing hidden */
@media(max-width:600px){
  :root{--ch:auto;--lh:auto;--py:14px;--px:16px}
  .grid{grid-template-columns:1fr}
  .other ol{grid-template-columns:1fr}
  .wrap{padding:0 14px 36px}
  header{padding:28px 0 18px;margin-bottom:20px}
  .hero{padding:18px}
  .card li{padding:12px 0 12px 26px}
  .card li::before{top:12px}
}
</style>
<div class="wrap">
  <header>
    <div id="date"></div>
    <h1>AI Weekly</h1>
    <p>The AI news that matters for work and life. No hype, no doom.</p>
  </header>
  <main id="app"></main>
  <footer>Curated automatically each Monday. Headlines link to their original publishers.</footer>
</div>
<script>
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const clean=(t,s)=>{
  if(s&&t.endsWith(" - "+s))return t.slice(0,-(s.length+3));
  const k=t.lastIndexOf(" - ");
  return(k>20&&t.length-k<45)?t.slice(0,k):t;
};
const link=i=>{
  const a=el("a","",clean(i.title,i.source));
  if(/^https:\/\//.test(i.link)){a.href=i.link;a.rel="noopener noreferrer";a.target="_blank"}
  return a;
};
// fixed slots, in reading order: row 1 = first three, row 2 = last three
const SLOTS=["Business & Strategy","Work & Jobs","Tools & Dev",
             "Frontier labs","Privacy & Safety","Food for thought"];
const COL={"Business & Strategy":"#A4B5FA","Work & Jobs":"#98FAFA","Tools & Dev":"#19FAAE",
           "Frontier labs":"#FDFDAC","Privacy & Safety":"#FCD08F","Food for thought":"#FA9B88","Other":"#D9DBDE"};

// if items overflow the fixed card height: hide the extras and add a "Read more" button
const fit=card=>{
  const ol=card.querySelector("ol");
  if(ol.querySelector(".empty")||ol.querySelector(".more"))return;
  const over=()=>ol.scrollHeight>ol.clientHeight+1;
  if(!over())return;
  const items=[...ol.querySelectorAll("li")];
  const li=el("li","more"),b=el("button","","Read more…");
  b.type="button";b.setAttribute("aria-expanded","false");
  li.append(b);ol.append(li);
  let hidden=0;
  for(let k=items.length-1;k>0&&over();k--){items[k].classList.add("hid");hidden++}
  b.textContent="Read more… (+"+hidden+")";
  b.onclick=()=>{
    const open=card.classList.toggle("open");
    b.setAttribute("aria-expanded",open);
    b.textContent=open?"Show less":"Read more… (+"+hidden+")";
  };
};
(async()=>{
  // ?w=2026-W44 loads that archived week; the regex restricts it to archive/ files only
  const w=new URLSearchParams(location.search).get("w");
  const ok=/^\d{4}-W\d\d$/.test(w||"");
  const r=await fetch(ok?`archive/${w}.json`:"data.json"),d=await r.json();
  const lm=r.headers.get("last-modified");
  document.getElementById("date").textContent=ok?"Issue "+w
    :new Date(lm||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});

  const app=document.getElementById("app");
  const cats=Object.keys(d).filter(c=>d[c].length);

  // hero = best-scored item (Frontier labs excluded: no scores)
  const all=cats.filter(c=>c!=="Frontier labs").flatMap(c=>d[c].map(i=>({...i,c})));
  const lead=all.sort((a,b)=>(b.score||0)-(a.score||0))[0];
  const heroCat=lead?lead.c:null;
  if(lead){
    const h=el("section","hero");h.style.setProperty("--c",COL[lead.c]||"#D9DBDE");
    const h2=el("h2");h2.append(link(lead));
    h.append(el("div","kicker","Top story · "+lead.c),h2);
    if(lead.source)h.append(el("div","src",lead.source));
    app.append(h);
    d[lead.c]=d[lead.c].filter(i=>i.link!==lead.link);
  }

  // slot lists; everything not in a slot (Other, Rules & Society, new names) goes to "Other"
  const L={};
  SLOTS.forEach(c=>L[c]=d[c]||[]);
  L["Other"]=Object.keys(d).filter(c=>!SLOTS.includes(c))
    .flatMap(c=>d[c]).sort((a,b)=>(b.score||0)-(a.score||0));

  const fontsReady=document.fonts?Promise.all([
    document.fonts.load('400 1em "Noto Serif"'),document.fonts.load('600 1em "Noto Serif"'),
    document.fonts.load('700 1em Montserrat'),document.fonts.load('700 1em "Noto Sans"')
  ]).catch(()=>{}):Promise.resolve();
  const grid=el("div","grid"),otherBox=el("div");
  app.append(grid,otherBox);

  const card=(c,cls)=>{
    const s=el("section","card"+(cls?" "+cls:""));
    s.style.setProperty("--c",COL[c]||"#D9DBDE");
    s.append(el("h3","",c));
    const ol=el("ol");
    if(!L[c].length){
      ol.append(el("li","empty",c===heroCat?"Top story is shown above":"No major news this week"));
    }
    for(const i of L[c]){
      const li=el("li");li.append(link(i));
      if(i.source)li.append(el("span","src",i.source));
      if(i.also&&i.also.length)li.append(el("span","src","Also: "+i.also.join(", ")));
      ol.append(li);
    }
    s.append(ol);
    return s;
  };

  const draw=()=>{
    grid.replaceChildren();otherBox.replaceChildren();
    SLOTS.forEach(c=>grid.append(card(c)));
    if(L["Other"].length)otherBox.append(card("Other","other"));   // hidden when empty
    // measure only after the card fonts are loaded, otherwise heights are wrong
    fontsReady.then(()=>{
      if(!matchMedia("(max-width:600px)").matches)
        document.querySelectorAll(".card").forEach(fit);
    });
  };
  draw();
  let lastW=innerWidth,t;
  addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{
    if(innerWidth!==lastW){lastW=innerWidth;draw()}},200)});

  // past issues
  try{
    const ws=await (await fetch("archive/index.json")).json();
    if(ws.length){
      const n=el("nav","past");
      const home=el("a","","Latest");home.href=location.pathname;n.append(home);
      ws.forEach(x=>{const a=el("a","",x);a.href="?w="+x;n.append(a)});
      app.append(n);
    }
  }catch(e){}
})();
</script>

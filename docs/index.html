<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'">
<title>AI Weekly</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2d9;--ch:400px;--lh:250px}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1e;--ink:#ececec;--muted:#9a9a9a;--line:#2c2c2e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 48px}
header{text-align:center;padding:44px 0 24px;border-bottom:3px double var(--line);margin-bottom:28px}
header h1{font:700 clamp(2.2rem,8vw,3.6rem)/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--muted)}
#date{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:20px}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--h,12) 70% 45%)}
.hero h2{font:700 clamp(1.35rem,4.5vw,2.2rem)/1.2 Georgia,serif;margin:8px 0}
.src{color:var(--muted);font-size:.8rem}

/* fixed grid: 3 columns, 2 rows; Frontier labs below, full width */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{display:flex;flex-direction:column;height:var(--ch);overflow:hidden;background:var(--card);border:1px solid var(--line);border-top:4px solid hsl(var(--h) 70% 50%);border-radius:14px;padding:18px 20px}
.card h3{flex:none;margin:0 0 10px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--h) 70% 45%)}
.card ol{flex:1;min-height:0;overflow:hidden;margin:0;padding:0;list-style:none;counter-reset:n}
.card li{counter-increment:n;padding:10px 0 10px 28px;position:relative;border-top:1px solid var(--line)}
.card li:first-child{border-top:0}
.card li::before{content:counter(n);position:absolute;left:0;top:10px;font:700 1rem Georgia,serif;color:var(--muted)}
.card li a{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card li .src{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card li.more{counter-increment:none;color:var(--muted);font-weight:700;letter-spacing:.2em}
.card li.more::before{content:none}
.labs{height:var(--lh);margin-top:16px}
.labs ol{display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px;align-content:start}
.labs li,.labs li:first-child{border-top:0;border-bottom:1px solid var(--line)}
.past{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px}
.past a{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-size:.8rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:36px}

/* tablet: 2 columns */
@media(max-width:899px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .labs ol{grid-template-columns:repeat(2,1fr)}
}
/* phone: 1 column, natural height, nothing truncated */
@media(max-width:600px){
  :root{--ch:auto;--lh:auto}
  .grid{grid-template-columns:1fr}
  .labs ol{grid-template-columns:1fr}
  .wrap{padding:0 14px 36px}
  header{padding:28px 0 18px;margin-bottom:20px}
  .hero{padding:18px;border-radius:14px}
  .card{padding:14px 16px;border-radius:12px}
  .card li{padding:12px 0 12px 26px}
  .card li::before{top:12px}
  .card li a{display:inline;-webkit-line-clamp:unset}
  .card li .src{white-space:normal}
}
</style>
<div class="wrap">
  <header>
    <div id="date"></div>
    <h1>AI Weekly</h1>
    <p>The AI news that matters for work and life. No hype, no doom.</p>
  </header>
  <main id="app"></main>
  <footer>Curated automatically each Monday. Headlines link to their original publishers.</footer>
</div>
<script>
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const clean=(t,s)=>{
  if(s&&t.endsWith(" - "+s))return t.slice(0,-(s.length+3));
  const k=t.lastIndexOf(" - ");
  return(k>20&&t.length-k<45)?t.slice(0,k):t;
};
const link=i=>{
  const a=el("a","",clean(i.title,i.source));
  if(/^https:\/\//.test(i.link)){a.href=i.link;a.rel="noopener noreferrer";a.target="_blank"}
  return a;
};
// if the list overflows its box, drop items from the end and show "…"
const fit=ol=>{
  const over=()=>ol.scrollHeight>ol.clientHeight+1;
  if(!over())return;
  ol.append(el("li","more","…"));
  while(over()&&ol.children.length>2)ol.children[ol.children.length-2].remove();
};
(async()=>{
  // ?w=2026-W44 loads that archived week; the regex restricts it to archive/ files only
  const w=new URLSearchParams(location.search).get("w");
  const ok=/^\d{4}-W\d\d$/.test(w||"");
  const r=await fetch(ok?`archive/${w}.json`:"data.json"),d=await r.json();
  const lm=r.headers.get("last-modified");
  document.getElementById("date").textContent=ok?"Issue "+w
    :new Date(lm||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});

  const app=document.getElementById("app");
  const cats=Object.keys(d).filter(c=>d[c].length);
  const hue=c=>({"Food for thought":280,"Frontier labs":200})[c]??((cats.indexOf(c)*47+12)%360);

  // hero = best-scored item (Frontier labs excluded: no scores)
  const all=cats.filter(c=>c!=="Frontier labs").flatMap(c=>d[c].map(i=>({...i,c})));
  const lead=all.sort((a,b)=>b.score-a.score)[0];
  if(lead){
    const h=el("section","hero");h.style.setProperty("--h",hue(lead.c));
    const h2=el("h2");h2.append(link(lead));
    h.append(el("div","kicker","Top story · "+lead.c),h2);
    if(lead.source)h.append(el("div","src",lead.source));
    app.append(h);
    d[lead.c]=d[lead.c].filter(i=>i.link!==lead.link);
  }

  // the 6 fullest categories fill the 2x3 grid
  const main=cats.filter(c=>c!=="Frontier labs"&&d[c].length)
    .sort((a,b)=>d[b].length-d[a].length).slice(0,6);
  const grid=el("div","grid"),labsBox=el("div");
  app.append(grid,labsBox);

  const card=c=>{
    const s=el("section","card"+(c==="Frontier labs"?" labs":""));
    s.style.setProperty("--h",hue(c));
    s.append(el("h3","",c));
    const ol=el("ol");
    for(const i of d[c]){
      const li=el("li");li.append(link(i));
      if(i.source)li.append(el("span","src",i.source));
      if(i.also&&i.also.length)li.append(el("span","src","Also: "+i.also.join(", ")));
      ol.append(li);
    }
    s.append(ol);
    return s;
  };

  const draw=()=>{
    grid.replaceChildren();labsBox.replaceChildren();
    main.forEach(c=>grid.append(card(c)));
    if(d["Frontier labs"]&&d["Frontier labs"].length)labsBox.append(card("Frontier labs"));
    if(!matchMedia("(max-width:600px)").matches)
      document.querySelectorAll(".card ol").forEach(fit);
  };
  (document.fonts?document.fonts.ready:Promise.resolve()).then(draw);
  let lastW=innerWidth,t;
  addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{
    if(innerWidth!==lastW){lastW=innerWidth;draw()}},200)});

  // past issues
  try{
    const ws=await (await fetch("archive/index.json")).json();
    if(ws.length){
      const n=el("nav","past");
      const home=el("a","","Latest");home.href=location.pathname;n.append(home);
      ws.forEach(x=>{const a=el("a","",x);a.href="?w="+x;n.append(a)});
      app.append(n);
    }
  }catch(e){}
})();
</script>
